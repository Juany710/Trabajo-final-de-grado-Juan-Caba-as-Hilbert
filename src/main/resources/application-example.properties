# Archivo de ejemplo con valores ficticios. La configuración real está en application.properties
# y toma los valores sensibles de variables de entorno (DB_USERNAME, DB_PASSWORD, JWT_SECRET).

spring.datasource.url=jdbc:mysql://localhost:3306/fixit_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Cordoba&allowPublicKeyRetrieval=true
spring.datasource.username=tu_usuario
spring.datasource.password=tu_contraseña
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
server.address=0.0.0.0
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.no-cache=true

# JWT — clave de al menos 256 bits (32 caracteres) para HS256. Se define con la variable de entorno JWT_SECRET.
fixit.jwt.secret=cambiar-por-una-clave-aleatoria-de-32-caracteres-o-mas
